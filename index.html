    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      font-family: var(--font);
      font-size: 13px;
      color: var(--foreground);
      background-color: var(--background);
      background-image: var(--wallpaper);
      background-size: cover;
      background-position: center;
    }

    button {
      font-family: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }

    /* ── Top bar ─────────────────────────────────────────────── */

    .top-bar {
      position: sticky;
      top: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      height: var(--bar-height);
      padding: 0 10px;
      background: var(--background); /* opaque, like the shell bar */
      border-bottom: 1px solid var(--hairline);
      user-select: none;
    }

    /* Omarchy logo (O mark, from the omarchy icon font glyph) */
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      border-radius: 6px;
    }

    .logo svg {
      width: 20px;
      height: 20px;
      fill: var(--bright-foreground);
    }

    .logo:hover { background: var(--hover-fill); }

    /* workspaces */
    .workspaces {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .workspace {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      opacity: 0.5; /* idle / unoccupied */
    }

    .workspace:hover { opacity: 1; background: var(--hover-fill); }

    .workspace.active {
      opacity: 1;
      color: var(--selected-text);
      background: var(--active-fill);
    }

    /* ── Launcher ────────────────────────────────────────────── */

    .launcher {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
    }

    .launcher.open { display: block; }

    .launcher__scrim {
      position: absolute;
      inset: 0;
      background: var(--scrim); /* menu scrim, 50% */
    }

    .launcher__card {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(480px, calc(100vw - 32px));
      max-height: min(640px, calc(100vh - 32px));
      display: flex;
      flex-direction: column;
      background: var(--card-bg); /* menu card, 0.95 */
      border: 1px solid var(--accent); /* menu border: active-border (accent) */
      border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }

    .launcher__header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--hairline);
    }

    .launcher__header svg {
      width: 16px;
      height: 16px;
      fill: var(--bright-foreground);
      flex: none;
    }

    .launcher__search {
      flex: 1;
      min-width: 0;
      font-family: inherit;
      font-size: 13px;
      color: var(--bright-foreground);
      background: none;
      border: 0;
      outline: 0;
    }

    .launcher__search::placeholder { color: var(--dark-foreground); }

    .launcher__list {
      overflow-y: auto;
      padding: 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--muted) transparent;
    }

    .launcher__empty {
      padding: 14px;
      text-align: center;
      color: var(--dark-foreground);
      display: none;
    }

    .launcher__empty.visible { display: block; }

    /* a row, styled like a menu entry */
    .link {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 40px;
      padding: 0 10px;
      border-radius: 8px;
      color: var(--foreground);
      text-decoration: none;
      opacity: 0.7;
    }

    .link svg { width: 16px; height: 16px; flex: none; }

    .link span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .link:hover,
    .link.selected {
      opacity: 1;
      background: var(--hover-fill);
      color: var(--selected-text);
    }

    .link.hidden { display: none; }

    .launcher__footer {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 14px;
      border-top: 1px solid var(--hairline);
      color: var(--dark-foreground);
      font-size: 11px;
    }
  </style>
</head>

  <script>
    const launcher  = document.getElementById("launcher");
    const logo      = document.getElementById("logo");
    const scrim     = document.getElementById("scrim");
    const search    = document.getElementById("search");
    const list      = document.getElementById("list");
    const empty     = document.getElementById("empty");
    const links     = Array.from(list.querySelectorAll(".link"));

    /* ── Themes — one built-in Omarchy theme per workspace ───────── */

    const workspaces = Array.from(document.querySelectorAll(".workspace"));

    function setTheme(n) {
      document.body.dataset.theme = String(n);
      for (const ws of workspaces) {
        const isActive = Number(ws.dataset.theme) === n;
        ws.classList.toggle("active", isActive);
        ws.setAttribute("aria-current", isActive ? "true" : "false");
      }
      try { localStorage.setItem("omarchy-theme", String(n)); } catch (e) {}
    }

    for (const ws of workspaces) {
      ws.addEventListener("click", () => setTheme(Number(ws.dataset.theme)));
    }

    let savedTheme = 1;
    try { savedTheme = Number(localStorage.getItem("omarchy-theme")) || 1; } catch (e) {}
    const urlTheme = Number(new URLSearchParams(location.search).get("theme"));
    if (urlTheme) savedTheme = urlTheme;
    setTheme(savedTheme >= 1 && savedTheme <= 8 ? savedTheme : 1);

    function visibleLinks() {
      return links.filter((link) => !link.classList.contains("hidden"));
    }

    function setSelected(index) {
      const visible = visibleLinks();
      visible.forEach((link) => link.classList.remove("selected"));
      if (!visible.length) return;
      const clamped = ((index % visible.length) + visible.length) % visible.length;
      visible[clamped].classList.add("selected");
      visible[clamped].scrollIntoView({ block: "nearest" });
    }

    function open() {
      launcher.classList.add("open");
      logo.setAttribute("aria-expanded", "true");
      search.value = "";
      filter();
      setSelected(0);
      search.focus();
      document.body.style.overflow = "hidden";
    }

    function close() {
      launcher.classList.remove("open");
      logo.setAttribute("aria-expanded", "false");
      document.body.style.overflow = "";
      logo.focus();
    }

    function filter() {
      const query = search.value.trim().toLowerCase();
      let count = 0;
      for (const link of links) {
        const match = !query || link.dataset.search.toLowerCase().includes(query);
        link.classList.toggle("hidden", !match);
        if (match) count++;
      }
      empty.classList.toggle("visible", count === 0);
      return count;
    }

    function currentIndex() {
      const visible = visibleLinks();
      return visible.findIndex((link) => link.classList.contains("selected"));
    }

    logo.addEventListener("click", () =>
      launcher.classList.contains("open") ? close() : open()
    );

    scrim.addEventListener("click", close);

    search.addEventListener("input", () => {
      filter();
      setSelected(0);
    });

    if (location.hash === "#menu") open();

    document.addEventListener("keydown", (event) => {
      if (!launcher.classList.contains("open")) return;

      if (event.key === "Escape") {
        event.preventDefault();
        close();
      } else if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        const delta = event.key === "ArrowDown" ? 1 : -1;
        setSelected(currentIndex() < 0 ? 0 : currentIndex() + delta);
      } else if (event.key === "Enter") {
        const visible = visibleLinks();
        if (!visible.length) return;
        const current = visible[currentIndex() < 0 ? 0 : currentIndex()];
        current.click();
      }
    });
  </script>
